server.port=8080
spring.application.name=securebank-backend

# SQLite datasource
spring.datasource.url=jdbc:sqlite:../database/securebank.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Logging configuration - never log sensitive credentials
logging.level.org.springframework.security=INFO
logging.level.com.securebank=INFO

# App CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
